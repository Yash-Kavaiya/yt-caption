name: Process YouTube Videos

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.txt'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -U pip
          pip install -U yt-dlp pillow numpy

      - name: Create processor script
        run: |
          cat > process.py << 'PYEND'
          import os, sys, subprocess, tempfile, shutil, json, re, hashlib, textwrap
          from pathlib import Path
          from PIL import Image
          import numpy as np
          from datetime import timedelta

          def sanitize_filename(filename, max_length=100):
              """Remove invalid characters from filename"""
              invalid_chars = '<>:"/\\|?*'
              for char in invalid_chars:
                  filename = filename.replace(char, '')
              filename = filename.strip('. ')
              filename = filename.replace(' ', '_')
              if len(filename) > max_length:
                  filename = filename[:max_length]
              return filename

          def format_time(seconds):
              """Convert seconds to readable format"""
              return str(timedelta(seconds=int(seconds)))

          def get_video_info(url):
              """Get video information using yt-dlp"""
              url = re.sub(r'[&?](list|index|si)=[^&]*', '', url)
              try:
                  cmd = ['yt-dlp', '--dump-json', '--no-playlist', url]
                  result = subprocess.run(cmd, capture_output=True, text=True, check=True, timeout=30)
                  info = json.loads(result.stdout)

                  subtitles_available = bool(info.get('subtitles', {})) or bool(info.get('automatic_captions', {}))

                  return {
                      'title': info.get('title', 'untitled'),
                      'duration': info.get('duration', 0),
                      'uploader': info.get('uploader', 'Unknown'),
                      'view_count': info.get('view_count', 0),
                      'subtitles_available': subtitles_available
                  }
              except Exception as e:
                  print(f"Error getting video info: {e}")
                  return None

          def download_video_and_transcript(url, video_path, transcript_path):
              """Download YouTube video and transcript"""
              url = re.sub(r'[&?](list|index|si)=[^&]*', '', url)
              try:
                  format_options = [
                      'bestvideo[height>=1080][ext=mp4]+bestaudio[ext=m4a]/best[height>=1080][ext=mp4]',
                      'bestvideo[height>=720][ext=mp4]+bestaudio[ext=m4a]/best[height>=720][ext=mp4]',
                      'best[ext=mp4]/best'
                  ]

                  cmd = [
                      'yt-dlp',
                      '-f', '/'.join(format_options),
                      '--no-playlist',
                      '--merge-output-format', 'mp4',
                      '-o', video_path,
                      '--write-auto-subs',
                      '--write-subs',
                      '--sub-lang', 'en',
                      '--convert-subs', 'srt',
                      url
                  ]

                  print("Downloading video...")
                  subprocess.run(cmd, check=True, timeout=600)

                  # Check for transcript
                  video_dir = os.path.dirname(video_path)
                  video_base = os.path.splitext(os.path.basename(video_path))[0]

                  subtitle_patterns = [
                      f"{video_base}.en.srt",
                      f"{video_base}.en.vtt",
                      f"{video_base}.srt",
                      f"{video_base}.vtt"
                  ]

                  transcript_found = False
                  for pattern in subtitle_patterns:
                      potential_file = os.path.join(video_dir, pattern)
                      if os.path.exists(potential_file):
                          convert_srt_to_text(potential_file, transcript_path)
                          transcript_found = True
                          break

                  return True, transcript_found

              except Exception as e:
                  print(f"Error downloading video: {e}")
                  return False, False

          def convert_srt_to_text(srt_file, text_file):
              """Convert SRT subtitle file to plain text"""
              try:
                  with open(srt_file, 'r', encoding='utf-8', errors='ignore') as f:
                      lines = f.readlines()

                  transcript_lines = []
                  current_text = []

                  for line in lines:
                      line = line.strip()
                      if line and not line.isdigit() and '-->' not in line:
                          line = re.sub('<[^<]+?>', '', line)
                          current_text.append(line)
                      elif not line and current_text:
                          transcript_lines.append(' '.join(current_text))
                          current_text = []

                  if current_text:
                      transcript_lines.append(' '.join(current_text))

                  with open(text_file, 'w', encoding='utf-8') as f:
                      f.write("VIDEO TRANSCRIPT\n")
                      f.write("=" * 50 + "\n\n")
                      full_text = ' '.join(transcript_lines)
                      full_text = re.sub(r'\s+', ' ', full_text)
                      wrapped_text = textwrap.fill(full_text, width=80)
                      f.write(wrapped_text)

                  return True
              except Exception as e:
                  print(f"Error converting transcript: {e}")
                  return False

          def extract_high_quality_screenshots(video_path, output_dir, interval, title_prefix):
              """Extract screenshots from video"""
              try:
                  os.makedirs(output_dir, exist_ok=True)

                  # Get video duration
                  cmd = [
                      'ffprobe', '-v', 'error',
                      '-show_entries', 'format=duration',
                      '-of', 'default=noprint_wrappers=1:nokey=1',
                      video_path
                  ]
                  result = subprocess.run(cmd, capture_output=True, text=True, check=True)
                  duration = float(result.stdout.strip())

                  print(f"Video duration: {duration:.1f} seconds")
                  print(f"Extracting screenshots every {interval} seconds...")

                  screenshots_taken = 0
                  current_time = 0
                  screenshot_files = []

                  while current_time <= duration:
                      time_str = f"{int(current_time):04d}s"
                      output_file = os.path.join(output_dir, f"{title_prefix}_{time_str}.png")

                      cmd = [
                          'ffmpeg', '-ss', str(current_time),
                          '-i', video_path, '-vframes', '1',
                          '-vf', 'scale=iw:ih', '-y', output_file
                      ]

                      subprocess.run(cmd, stdout=subprocess.DEVNULL,
                                   stderr=subprocess.DEVNULL, check=True)

                      screenshots_taken += 1
                      screenshot_files.append(output_file)

                      progress = (current_time / duration) * 100
                      print(f"  [{progress:5.1f}%] Screenshot at {format_time(current_time)}")

                      current_time += interval

                  return screenshots_taken, screenshot_files

              except Exception as e:
                  print(f"Error extracting screenshots: {e}")
                  return 0, []

          def get_image_hash(image_path):
              """Calculate hash of an image"""
              try:
                  with open(image_path, 'rb') as f:
                      return hashlib.sha256(f.read()).hexdigest()
              except Exception:
                  return None

          def remove_duplicate_screenshots(screenshot_files):
              """Remove duplicate screenshots"""
              if len(screenshot_files) <= 1:
                  return 0

              print("\nRemoving duplicate screenshots...")

              duplicates_removed = 0
              files_to_remove = set()
              processed_hashes = {}

              for current_file in screenshot_files:
                  if current_file in files_to_remove or not os.path.exists(current_file):
                      continue

                  current_hash = get_image_hash(current_file)
                  if not current_hash:
                      continue

                  if current_hash in processed_hashes:
                      files_to_remove.add(current_file)
                  else:
                      processed_hashes[current_hash] = current_file

              for file_path in files_to_remove:
                  try:
                      os.remove(file_path)
                      duplicates_removed += 1
                  except Exception:
                      pass

              return duplicates_removed

          def create_hd_pdf(images_dir, pdf_path, dpi=600):
              """Create high-quality PDF from images"""
              try:
                  print(f"\nCreating PDF (DPI: {dpi})...")

                  image_files = sorted(list(Path(images_dir).glob('*.jpg')) +
                                     list(Path(images_dir).glob('*.png')))

                  if not image_files:
                      return False

                  pdf_images = []
                  for img_path in image_files:
                      try:
                          img = Image.open(img_path)
                          if img.mode != 'RGB':
                              img = img.convert('RGB')

                          max_dimension = 3000
                          if img.width > max_dimension or img.height > max_dimension:
                              img.thumbnail((max_dimension, max_dimension), Image.Resampling.LANCZOS)

                          pdf_images.append(img)
                      except Exception:
                          pass

                  if pdf_images:
                      pdf_images[0].save(
                          pdf_path, "PDF",
                          resolution=dpi,
                          quality=95,
                          optimize=True,
                          save_all=True,
                          append_images=pdf_images[1:] if len(pdf_images) > 1 else []
                      )

                      file_size = os.path.getsize(pdf_path) / (1024 * 1024)
                      print(f"  ✓ PDF created: {file_size:.2f} MB")
                      return True

                  return False

              except Exception as e:
                  print(f"Error creating PDF: {e}")
                  return False

          def process(url, interval, outdir):
              """Main processing function"""

              # Get video info
              print(f"Fetching video information...")
              video_info = get_video_info(url)
              if not video_info:
                  return False

              safe_title = sanitize_filename(video_info['title'])

              print(f"\n{'='*60}")
              print(f"Video: {video_info['title']}")
              print(f"Duration: {format_time(video_info['duration'])}")
              print(f"Uploader: {video_info['uploader']}")
              print(f"{'='*60}\n")

              # Create directories
              base_dir = Path(outdir)
              video_dir = base_dir / safe_title
              images_dir = video_dir / 'images'
              images_dir.mkdir(parents=True, exist_ok=True)

              with tempfile.TemporaryDirectory() as temp_dir:
                  video_path = os.path.join(temp_dir, 'video.mp4')
                  transcript_path = video_dir / f"{safe_title}_transcript.txt"

                  # Download
                  video_success, transcript_success = download_video_and_transcript(
                      url, video_path, transcript_path
                  )

                  if not video_success:
                      print("Error: Failed to download video")
                      return False

                  print(f"\n✓ Video downloaded successfully!")

                  # Extract screenshots
                  screenshot_count, screenshot_files = extract_high_quality_screenshots(
                      video_path, images_dir, interval, safe_title
                  )

                  if screenshot_count > 0:
                      print(f"\n✓ Extracted {screenshot_count} screenshots")

                      # Remove duplicates
                      duplicates = remove_duplicate_screenshots(screenshot_files)
                      if duplicates > 0:
                          print(f"✓ Removed {duplicates} duplicates")
                          print(f"  Final: {screenshot_count - duplicates} unique screenshots")

                      # Create PDF
                      pdf_path = video_dir / f"{safe_title}_HD.pdf"
                      create_hd_pdf(images_dir, pdf_path, 600)

                      # Summary
                      print(f"\n{'='*60}")
                      print(f"✅ COMPLETED SUCCESSFULLY!")
                      print(f"{'='*60}")
                      print(f"📁 Output: {video_dir.absolute()}")
                      print(f"🖼️  Screenshots: {len(screenshot_files) - duplicates}")
                      print(f"📄 PDF: {pdf_path.name}")
                      if transcript_success:
                          print(f"📝 Transcript: {transcript_path.name}")
                      print(f"{'='*60}\n")

                      return True
                  else:
                      print("Error: No screenshots extracted")
                      return False

          if __name__ == '__main__':
              if len(sys.argv) != 4:
                  print('Usage: process.py <url> <interval> <outdir>')
                  sys.exit(1)
              sys.exit(0 if process(sys.argv[1], int(sys.argv[2]), sys.argv[3]) else 1)
          PYEND

      - name: Process all videos
        run: |
          mkdir -p output
          
          echo "Finding .txt files..."
          find . -type f -name "*.txt" \
            ! -name "requirements*.txt" \
            ! -name "deps.txt" \
            ! -path "./output/*" \
            ! -path "./.git/*" \
            ! -path "./.github/*" | sort > files_to_process.txt
          
          echo "Files to process:"
          cat files_to_process.txt
          
          SUCCESS=0
          FAILED=0
          
          while read txtfile; do
            echo ""
            echo "###############################################"
            echo "# Processing: $txtfile"
            echo "###############################################"
            
            while IFS= read -r line || [ -n "$line" ]; do
              # Skip empty and comments
              [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
              
              # Get URL and interval
              URL=$(echo "$line" | cut -d',' -f1 | tr -d ' ')
              INTERVAL=$(echo "$line" | cut -d',' -f2 | tr -d ' ')
              
              # Validate URL
              if [[ ! "$URL" =~ youtube\.com ]] && [[ ! "$URL" =~ youtu\.be ]]; then
                echo "SKIP: Not a YouTube URL: $URL"
                continue
              fi
              
              # Default interval
              if [[ -z "$INTERVAL" || "$INTERVAL" == "$URL" ]]; then
                INTERVAL=5
              fi
              
              echo ""
              echo ">>> Processing Video"
              echo "    URL: $URL"
              echo "    Interval: ${INTERVAL}s"
              
              # Process
              if python process.py "$URL" "$INTERVAL" output; then
                echo "    STATUS: ✅ SUCCESS"
                SUCCESS=$((SUCCESS + 1))
              else
                echo "    STATUS: ❌ FAILED"
                FAILED=$((FAILED + 1))
              fi
              
              # Delay to avoid rate limiting
              echo "    Waiting 5 seconds..."
              sleep 5
              
            done < "$txtfile"
            
          done < files_to_process.txt
          
          echo ""
          echo "###############################################"
          echo "# SUMMARY"
          echo "###############################################"
          echo "SUCCESS: $SUCCESS"
          echo "FAILED:  $FAILED"
          echo "###############################################"

      - name: Create index
        run: |
          cat > output/README.md << 'MDEND'
          # YouTube Video Processing Results
          
          ## Videos Processed
          
          MDEND
          
          if [ -d output ] && [ "$(ls -A output)" ]; then
            echo "| # | Title | Files |" >> output/README.md
            echo "|---|-------|-------|" >> output/README.md
            
            i=1
            for dir in output/*/; do
              if [ -d "$dir" ]; then
                name=$(basename "$dir")
                pdf="${name}_HD.pdf"
                txt="${name}_transcript.txt"
                
                files=""
                [ -f "$dir/$pdf" ] && files="$files [PDF](./$name/$pdf)"
                [ -f "$dir/$txt" ] && files="$files [TXT](./$name/$txt)"
                
                if [ -n "$files" ]; then
                  echo "| $i | $name | $files |" >> output/README.md
                  i=$((i + 1))
                fi
              fi
            done
          else
            echo "No videos processed." >> output/README.md
          fi
          
          echo "" >> output/README.md
          echo "Generated: $(date)" >> output/README.md

      - name: Show results
        run: |
          echo "Output directory contents:"
          ls -la output/
          echo ""
          echo "Generated files:"
          find output -type f -name "*.pdf" -o -name "*_transcript.txt" | sort

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: output/**/*_HD.pdf
          if-no-files-found: warn

      - name: Upload transcripts
        uses: actions/upload-artifact@v4
        with:
          name: transcripts
          path: output/**/*_transcript.txt
          if-no-files-found: warn

      - name: Upload all
        uses: actions/upload-artifact@v4
        with:
          name: complete-output
          path: output/

      - name: Commit to repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add output/
          
          if ! git diff --staged --quiet; then
            git commit -m "Add processed videos [skip ci]"
            git push || echo "Could not push (check permissions)"
          else
            echo "No changes to commit"
          fi
